<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#120a3a">
<title>Space Explorer!</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Space Explorer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root{
    --font: "Comic Sans MS","Chalkboard SE","Comic Neue","Baloo 2","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#120a3a;font-family:var(--font);color:#fff;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  #sky{position:fixed;inset:0;width:100%;height:100%;display:block;
    background:radial-gradient(ellipse at 20% 30%,#3b1d7a 0%,rgba(59,29,122,0) 55%),
               radial-gradient(ellipse at 80% 75%,#7a1d6b 0%,rgba(122,29,107,0) 50%),
               radial-gradient(ellipse at 60% 10%,#1d4a7a 0%,rgba(29,74,122,0) 45%),
               linear-gradient(180deg,#0d0830 0%,#1b0f4d 60%,#2a0f45 100%);}
  #space{position:fixed;inset:0;}
  button{font-family:var(--font);}
  .body-btn{position:absolute;transform:translate(-50%,-50%);border:none;background:none;padding:0;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;outline:none;}
  .body-btn .art{display:block;transition:transform .25s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 0 10px rgba(255,255,255,.25));}
  .body-btn:hover .art,.body-btn:focus-visible .art{transform:scale(1.12);}
  .body-btn:active .art{transform:scale(.95);}
  .body-btn .label{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;white-space:nowrap;
    font-size:clamp(14px,2.1vmin,22px);font-weight:bold;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;
    background:rgba(20,10,60,.55);padding:1px 10px;border-radius:999px;pointer-events:none;}
  .body-btn .got{position:absolute;right:-4%;top:-4%;width:34%;min-width:22px;max-width:40px;opacity:0;transform:scale(0);
    transition:all .4s cubic-bezier(.3,1.8,.5,1);pointer-events:none;}
  .body-btn.visited .got{opacity:1;transform:scale(1);}
  .spin{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .wobble{animation:wobble 4s ease-in-out infinite;}
  @keyframes wobble{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  #rocket{position:absolute;left:0;top:0;width:var(--rs,70px);height:calc(var(--rs,70px)*1.5);pointer-events:none;z-index:5;
    transform-origin:50% 50%;will-change:transform;}
  #rocket .bob{width:100%;height:100%;animation:bob 1.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
  #rocket .flame{transform-origin:50% 0;animation:flick .12s infinite alternate;opacity:.35;transition:opacity .2s;}
  #rocket.flying .flame{opacity:1;}
  @keyframes flick{from{transform:scaleY(.85)}to{transform:scaleY(1.2)}}

  /* top bar */
  #topbar{position:fixed;left:0;right:0;top:0;display:flex;justify-content:center;align-items:center;gap:12px;padding:10px;z-index:6;pointer-events:none;}
  #topbar{flex-wrap:wrap;}
  #badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#ff8fab,#ff5e7e);border:3px solid #ffd84d;
    padding:4px 16px 4px 8px;border-radius:999px;font-size:clamp(16px,2.6vmin,24px);font-weight:bold;color:#fff;
    text-shadow:0 2px 0 rgba(120,0,40,.45);box-shadow:0 4px 0 rgba(0,0,0,.25);white-space:nowrap;}
  #badge svg{width:1.5em;height:1.5em;animation:wobble 3s ease-in-out infinite;}
  #welcome{font-size:clamp(28px,6.5vmin,64px);font-weight:bold;color:#ffb3c6;margin:6px 0 4px;
    text-shadow:0 4px 0 #b5179e,0 8px 18px rgba(0,0,0,.5);padding:0 12px;}
  #hint{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.25);padding:6px 18px;border-radius:999px;
    font-size:clamp(16px,2.6vmin,26px);font-weight:bold;text-shadow:0 2px 0 rgba(0,0,0,.4);}
  /* sticker bar */
  #stickers{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(4px,1vmin,8px);align-items:center;width:max-content;
    background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.25);border-radius:30px;padding:6px 14px;z-index:6;max-width:96vw;}
  #stickers .slot{width:clamp(30px,min(5vmin,8.5vw),48px);height:clamp(30px,min(5vmin,8.5vw),48px);border-radius:50%;position:relative;border:none;padding:0;
    background:rgba(0,0,0,.25);cursor:pointer;}
  #stickers .slot svg.mini{width:100%;height:100%;filter:grayscale(1) brightness(.55);opacity:.6;transition:all .4s;}
  #stickers .slot.on svg.mini{filter:none;opacity:1;}
  #stickers .slot .st{position:absolute;right:-6px;top:-6px;width:55%;opacity:0;transform:scale(0) rotate(-90deg);transition:all .5s cubic-bezier(.3,1.8,.5,1);}
  #stickers .slot.on .st{opacity:1;transform:scale(1) rotate(0);}
  #count{font-weight:bold;font-size:clamp(14px,2.4vmin,24px);margin-left:6px;white-space:nowrap;}

  /* overlays */
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
    background:rgba(8,4,30,.6);opacity:0;pointer-events:none;transition:opacity .3s;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .card{width:min(92vw,760px);max-height:94vh;overflow:auto;background:#fffaf0;color:#2b1d4f;border-radius:36px;border:8px solid var(--c,#ffcc33);
    box-shadow:0 0 0 8px rgba(255,255,255,.2),0 20px 60px rgba(0,0,0,.6);padding:22px 28px 26px;text-align:center;
    transform:scale(.6) translateY(40px);transition:transform .45s cubic-bezier(.3,1.6,.5,1);}
  .overlay.show .card{transform:scale(1) translateY(0);}
  .card .big{width:min(40vmin,240px);height:min(40vmin,240px);margin:0 auto;display:block;}
  .card h1{margin:4px 0 6px;font-size:clamp(34px,7vmin,64px);color:var(--c,#ffcc33);
    text-shadow:3px 3px 0 #2b1d4f,-1px -1px 0 #2b1d4f,1px -1px 0 #2b1d4f,-1px 1px 0 #2b1d4f;letter-spacing:1px;}
  .card p.fact{font-size:clamp(22px,4vmin,36px);line-height:1.35;margin:4px 0 16px;font-weight:bold;}
  .card .earned{display:inline-flex;align-items:center;gap:8px;font-size:clamp(18px,3vmin,26px);font-weight:bold;color:#b8860b;
    background:#fff3c4;border-radius:999px;padding:4px 16px;margin-bottom:12px;}
  .card .earned svg{width:34px;height:34px;animation:pop .8s cubic-bezier(.3,1.8,.5,1);}
  @keyframes pop{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
  .btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
  .bigbtn{display:inline-flex;align-items:center;gap:10px;border:none;border-radius:999px;cursor:pointer;
    font-size:clamp(20px,3.4vmin,30px);font-weight:bold;padding:14px 26px;min-height:64px;color:#fff;
    box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .1s;}
  .bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .bigbtn svg{width:36px;height:36px;}
  .b-blue{background:#2f80ed;} .b-purple{background:#9b5de5;}
  .dots{display:flex;gap:8px;justify-content:center;margin:-6px 0 14px;}
  .dots span{width:14px;height:14px;border-radius:50%;background:#e2d9f3;}
  .dots span.on{background:var(--c,#ffcc33);box-shadow:0 0 0 2px #2b1d4f;}
  .newfact{animation:factin .45s cubic-bezier(.3,1.5,.5,1);}
  @keyframes factin{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
  /* talking animation: mouths move, card planet and rocket bounce */
  .mouth{transform-box:fill-box;transform-origin:center top;}
  body.talking #cardOv .mouth, body.talking #party .mouth{animation:talk .18s ease-in-out infinite alternate;}
  @keyframes talk{from{transform:scaleY(.6)}to{transform:scaleY(1.9) scaleX(.85)}}
  body.talking #cardArt .big{animation:boing .5s ease-in-out infinite alternate;}
  @keyframes boing{from{transform:translateY(0) scale(1,1)}to{transform:translateY(-6px) scale(1.04,.97)}}
  body.talking #rocket .bob{animation-duration:.5s;} .b-green{background:#27ae60;} .b-orange{background:#f2994a;}

  @media (max-width:480px), (max-height:700px){
    .card{padding:12px 14px 16px;border-width:6px;border-radius:28px;}
    .card .big{height:min(26vh,170px);}
    .card h1{font-size:clamp(28px,8vw,44px);margin:0 0 4px;}
    .card p.fact{font-size:clamp(19px,5.2vw,28px);margin:2px 0 12px;}
    .card .earned{margin-bottom:6px;padding:2px 12px;font-size:18px;}
    .card .earned svg{width:26px;height:26px;}
    .dots{margin:-4px 0 10px;}
    .btns{gap:10px;}
    .bigbtn{font-size:19px;padding:8px 18px;min-height:56px;gap:8px;}
    .bigbtn svg{width:30px !important;height:30px !important;}
  }
  #start{background:rgba(8,4,30,.62);flex-direction:column;text-align:center;}
  #start h1{font-size:clamp(44px,11vmin,110px);margin:0;color:#ffd84d;
    text-shadow:0 6px 0 #e8590c,0 10px 20px rgba(0,0,0,.6);transform:rotate(-3deg);}
  #start p{font-size:clamp(20px,3.6vmin,32px);margin:8px 0 22px;font-weight:bold;}
  #start .rk{width:min(22vmin,150px);animation:bob 1.6s ease-in-out infinite;}
  #startBtn{font-size:clamp(28px,6vmin,52px);padding:20px 48px;background:#ff5e7e;animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  #party h1{font-size:clamp(34px,7vmin,60px);color:#ff5e7e;margin:6px 0;text-shadow:2px 2px 0 #2b1d4f;}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:11;width:100%;height:100%;}

  /* ---------- Star pictures (constellations) ---------- */
  #skyBtn{position:fixed;right:10px;top:10px;z-index:7;width:clamp(64px,9vmin,84px);height:clamp(64px,9vmin,84px);border-radius:50%;
    border:3px solid #ffd84d;background:radial-gradient(circle at 40% 35%,#3b2a8f,#160c44);padding:7px;cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.3),0 0 16px rgba(255,216,77,.45);animation:skyglow 2.4s ease-in-out infinite;}
  #skyBtn:active{transform:translateY(3px);}
  #skyBtn svg{width:100%;height:100%;display:block;pointer-events:none;}
  #skyBtn .lab{position:absolute;top:100%;right:-6px;margin-top:5px;white-space:nowrap;font-size:clamp(13px,1.9vmin,18px);font-weight:bold;
    color:#ffe9a8;background:rgba(20,10,60,.7);padding:1px 9px;border-radius:999px;pointer-events:none;text-shadow:0 1px 0 #000;}
  @keyframes skyglow{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.3),0 0 10px rgba(255,216,77,.35)}50%{box-shadow:0 4px 0 rgba(0,0,0,.3),0 0 24px rgba(255,216,77,.8)}}
  #constOv{background:radial-gradient(ellipse at 50% 25%,#2a1866 0%,#120a3a 55%,#08041e 100%);flex-direction:column;justify-content:flex-start;
    padding:10px 12px 12px;}
  #csPick,#csPlay{display:none;flex-direction:column;align-items:center;width:100%;height:100%;min-height:0;}
  #constOv.pick #csPick,#constOv.play #csPlay{display:flex;}
  #csPick{overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
  .cs-head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;flex:0 0 auto;}
  .cs-title{font-size:clamp(28px,5.6vmin,54px);font-weight:bold;color:#ffd84d;text-shadow:0 4px 0 #b5179e,0 8px 16px rgba(0,0,0,.5);text-align:center;flex:1;line-height:1.1;}
  .cs-sub{font-size:clamp(17px,2.8vmin,26px);font-weight:bold;text-align:center;margin:4px 8px 8px;max-width:900px;text-shadow:0 2px 0 rgba(0,0,0,.4);}
  .cs-modes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:2px 0 12px;}
  .cs-mode{border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;font-size:clamp(18px,3vmin,26px);
    font-weight:bold;padding:10px 22px;min-height:60px;cursor:pointer;}
  .cs-mode.on{background:#ffd84d;border-color:#fff;color:#2b1d4f;box-shadow:0 0 18px rgba(255,216,77,.6);}
  .cs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,21vmin,210px),1fr));gap:clamp(10px,1.8vmin,18px);width:min(100%,1000px);padding:6px 6px 14px;}
  .cs-tile{position:relative;border:3px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);border-radius:24px;padding:6px 6px 10px;color:#fff;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;font-weight:bold;font-size:clamp(17px,2.6vmin,24px);min-height:120px;}
  .cs-tile:active{transform:scale(.96);}
  .cs-tile svg{width:100%;height:clamp(90px,17vmin,170px);display:block;pointer-events:none;}
  .cs-tile.done{border-color:#ffd84d;background:rgba(255,216,77,.13);}
  .cs-tile .got{position:absolute;right:-10px;top:-10px;width:44px;height:44px;opacity:0;transform:scale(0);transition:all .4s cubic-bezier(.3,1.8,.5,1);pointer-events:none;}
  .cs-tile.done .got{opacity:1;transform:scale(1);}
  .cs-tile span{pointer-events:none;}
  .cs-back{flex:0 0 auto;}
  #csCount{font-size:clamp(17px,2.6vmin,24px);font-weight:bold;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 14px;}
  #csCount svg{width:30px;height:30px;}
  #csAll{display:none;font-size:clamp(22px,4vmin,36px);font-weight:bold;color:#2b1d4f;background:#ffd84d;border-radius:24px;padding:8px 20px;margin:0 8px 10px;text-align:center;
    animation:factin .45s cubic-bezier(.3,1.5,.5,1);}
  #csPick.alldone #csAll{display:block;}
  #csSky{flex:1 1 auto;width:100%;min-height:0;display:block;touch-action:none;cursor:pointer;}
  #csThumb{width:clamp(64px,10vmin,96px);height:clamp(64px,10vmin,96px);border:2px dashed rgba(255,255,255,.35);border-radius:16px;flex:0 0 auto;}
  #csThumb svg{width:100%;height:100%;display:block;}
  .cs-star .core{fill:#fffbe6;transition:fill .3s;}
  .cs-star .ring{opacity:0;stroke:#ffd84d;transition:opacity .2s;}
  .cs-star.lit .core{fill:#ffd60a;}
  .cs-star.lit .num{display:none;}
  .cs-star.next .ring,.cs-star.hint .ring{opacity:1;animation:csPulse 1s ease-in-out infinite;}
  .cs-star.pen .ring{opacity:1;stroke:#7ee8fa;}
  .cs-star.oops .core{animation:csOops .5s ease-in-out;}
  @keyframes csPulse{0%,100%{stroke-width:.6;stroke-opacity:1}50%{stroke-width:2.2;stroke-opacity:.45}}
  @keyframes csOops{0%,100%{fill:#fffbe6}40%{fill:#ff7aa2}}
  .cs-tag{opacity:0;transition:opacity .8s .4s;}
  .cs-line{stroke:#ffd84d;stroke-width:1.3;stroke-linecap:round;fill:none;animation:csDraw .35s ease-out forwards;}
  @keyframes csDraw{to{stroke-dashoffset:0}}
  .cs-pic{opacity:0;transition:opacity 1.2s ease-in;}
  #csSky.done .cs-pic{opacity:.33;}
  #csSky.done .cs-tag{opacity:1;}
  #csSky.done .cs-line{stroke:#fff3b0;stroke-width:1.7;filter:drop-shadow(0 0 1.5px #ffd84d);}
  #csReveal{display:none;flex:0 0 auto;width:min(96vw,760px);margin-top:6px;padding:12px 18px 14px;max-height:none;transform:none;}
  #csPlay.revealed #csReveal{display:block;animation:factin .45s cubic-bezier(.3,1.5,.5,1);}
  #csReveal h1{margin:0 0 4px;}
  #csReveal p.fact{margin:2px 0 10px;}
  #csReveal .earned{margin-bottom:6px;}
  @media (max-width:480px), (max-height:700px){ #csReveal{padding:8px 10px 10px;} .cs-mode{min-height:52px;padding:6px 14px;} }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="space"></div>
<div id="topbar"><div id="badge" aria-label="Captain"></div><div id="hint">Tap a planet to fly there!</div></div>
<div id="stickers"></div>

<div id="cardOv" class="overlay" role="dialog" aria-modal="true">
  <div class="card" id="card">
    <div id="cardArt"></div>
    <h1 id="cardName">Planet</h1>
    <div id="earned" class="earned" style="display:none"></div>
    <p class="fact" id="cardFact">Fact</p>
    <div id="dots" class="dots"></div>
    <div class="btns">
      <button class="bigbtn b-blue" id="againBtn" aria-label="Hear it again"></button>
      <button class="bigbtn b-purple" id="moreBtn" aria-label="Tell me more"></button>
      <button class="bigbtn b-green" id="closeBtn" aria-label="Keep exploring"></button>
    </div>
  </div>
</div>

<div id="party" class="overlay" role="dialog" aria-modal="true">
  <div class="card" style="--c:#ff5e7e">
    <div id="partyArt"></div>
    <h1 id="partyTitle">Great job, Captain!</h1>
    <p class="fact" id="partyText">You visited every place in space!</p>
    <div class="btns">
      <button class="bigbtn b-orange" id="replayBtn"></button>
    </div>
  </div>
</div>

<div id="start" class="overlay show">
  <div id="startRocket"></div>
  <div id="welcome">Welcome, Captain!</div>
  <h1>Space Explorer!</h1>
  <p>Fly your rocket to the Sun, the Moon, and the planets!</p>
  <button class="bigbtn" id="startBtn">Tap to Start</button>
</div>
<button id="skyBtn" aria-label="Star pictures"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M10 69 L26 54 L40 53 L57 51 L84 31 L90 47 L68 60 L57 51" stroke="#ffd84d" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity=".8"/><g fill="#fff"><circle cx="10" cy="69" r="6"/><circle cx="26" cy="54" r="5.5"/><circle cx="40" cy="53" r="6"/><circle cx="57" cy="51" r="5"/><circle cx="84" cy="31" r="6.5"/><circle cx="90" cy="47" r="5.5"/><circle cx="68" cy="60" r="5.5"/></g></svg><span class="lab">Star Pictures</span></button>

<div id="constOv" class="overlay" role="dialog" aria-modal="true">
  <div id="csPick">
    <div class="cs-head">
      <button class="bigbtn b-green cs-back" id="csHome" aria-label="Back to space"></button>
      <div class="cs-title">Star Pictures</div>
      <div id="csCount"></div>
    </div>
    <div class="cs-sub">Connect the stars to make a picture in the sky!</div>
    <div id="csAll"></div>
    <div class="cs-modes">
      <button class="cs-mode on" id="csEasyBtn">1 2 3 &nbsp;Easy</button>
      <button class="cs-mode" id="csHardBtn">&#11088; Tricky</button>
    </div>
    <div class="cs-grid" id="csGrid"></div>
  </div>
  <div id="csPlay">
    <div class="cs-head">
      <button class="bigbtn b-purple cs-back" id="csBack" aria-label="More star pictures"></button>
      <div class="cs-title" id="csName">Stars</div>
      <div id="csThumb"></div>
    </div>
    <svg id="csSky" viewBox="-9 -9 118 118" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="card" id="csReveal" style="--c:#ffd84d">
      <h1 id="csRName">Name</h1>
      <div id="csEarned" class="earned" style="display:none"></div>
      <p class="fact" id="csFact">Fact</p>
      <div id="csDots" class="dots"></div>
      <div class="btns">
        <button class="bigbtn b-blue" id="csAgain" aria-label="Hear it again"></button>
        <button class="bigbtn b-purple" id="csMore" aria-label="Tell me more"></button>
        <button class="bigbtn b-green" id="csNext" aria-label="More star pictures"></button>
      </div>
    </div>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
(function(){
"use strict";

/* ---------------- Data ---------------- */
// Facts checked against NASA kid/science pages.
const BODIES = [
  {id:"sun", name:"The Sun", color:"#ffb703", size:.24, facts:[
    "The Sun is a star! It is so big that more than one million Earths could fit inside it.",
    "The Sun gives us light and keeps us warm. Plants need sunlight to grow.",
    "Light from the Sun takes about eight minutes to zoom all the way to Earth."]},
  {id:"mercury", name:"Mercury", color:"#a8a29e", size:.06, facts:[
    "Mercury is the smallest planet. It is also the closest planet to the Sun.",
    "Mercury zooms around the Sun faster than any other planet. A year there is only 88 days!",
    "Mercury has no moons at all."]},
  {id:"venus", name:"Venus", color:"#f4a261", size:.08, facts:[

const sky = document.getElementById("sky"), sctx = sky.getContext("2d");
let stars = [], shooting = null;
function makeStars(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  sky.width = innerWidth*dpr; sky.height = innerHeight*dpr; sctx.setTransform(dpr,0,0,dpr,0,0);
  const n = Math.round(innerWidth*innerHeight/3500);
  stars = Array.from({length:n}, () => ({x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:Math.random()*1.6+.3,
    p:Math.random()*6.28, s:Math.random()*2+.5, c:["#fff","#fff","#ffe9a8","#bfe3ff","#ffc8e8"][Math.random()*5|0]}));
}
function drawSky(t){
  sctx.clearRect(0,0,innerWidth,innerHeight);
  for(const s of stars){
    sctx.globalAlpha = .45 + .55*Math.abs(Math.sin(s.p + t/1000*s.s));
    sctx.fillStyle = s.c; sctx.beginPath(); sctx.arc(s.x,s.y,s.r,0,6.283); sctx.fill();
  }
  sctx.globalAlpha = 1;
  if(!shooting && Math.random() < .004) shooting = {x:Math.random()*innerWidth*.7, y:Math.random()*innerHeight*.4, life:0};
  if(shooting){
    shooting.life += 1; const l = shooting.life, x = shooting.x + l*9, y = shooting.y + l*4;
    const gr = sctx.createLinearGradient(x-90,y-40,x,y); gr.addColorStop(0,"rgba(255,255,255,0)"); gr.addColorStop(1,"rgba(255,255,255,.9)");
    sctx.strokeStyle = gr; sctx.lineWidth = 2.5; sctx.beginPath(); sctx.moveTo(x-90,y-40); sctx.lineTo(x,y); sctx.stroke();
    if(l > 45) shooting = null;
  }
  requestAnimationFrame(drawSky);
}

function buildBodies(){

function layout(){
  const W = innerWidth, H = innerHeight;
  const land = W >= H;
  const base = Math.min(land ? Math.min(H*1.0, W*0.62) : Math.min(W*1.0, H*0.62), 900);
  const bar = document.getElementById("stickers");
  const tb = document.getElementById("topbar"); const topPad = Math.max(64, (tb ? tb.offsetHeight : 54) + 10), botPad = (bar ? bar.offsetHeight : 60) + 34;
  const L = land ? LAYOUT_WIDE : LAYOUT_TALL;
  for(const b of BODIES){
    const [fx, fy] = L[b.id];
    let x = W*fx, y = topPad + (H-topPad-botPad)*fy;
    if(b.id === "sun"){ if(land) x = Math.max(x, base*b.size*.67); else y = Math.max(y, base*b.size*.62 + 6); }
    const d = Math.max(base*b.size, 44);
    const a = vbAspect(b.id);
    const w = d * a.w/120, h = d * a.h/120;
    const holder = els[b.id].firstElementChild;
    holder.innerHTML = svgFor(b.id, w, h);
    const lab = els[b.id].querySelector(".label");
    lab.style.cssText = "";

    els[b.id].style.left = x+"px"; els[b.id].style.top = y+"px";
    els[b.id].style.minWidth = "64px"; els[b.id].style.minHeight = "64px"; els[b.id].style.justifyContent = "center";
    geo[b.id] = {x, y, r: d/2, hw: Math.max(w, h)/2};
  }

  rocketSize = rs;
  if(rocketAt){ placeRocketNear(rocketAt); } else { placeRocketNear("earth"); }

/* ---------------- Rocket flight ---------------- */
let flightId = 0, rocketSize = 70, rx = 0, ry = 0, rang = 0, rocketAt = "earth", anim = null, pendingCard = null;
function setRocket(x, y, ang){
  rx = x; ry = y; rang = ang;
  const r = document.getElementById("rocket");
  r.style.transform = `translate(${x - rocketSize/2}px, ${y - rocketSize*.75}px) rotate(${ang}deg)`;
}
function parkPoint(id){
  const g = geo[id];
  // park to the left-ish side of the body, toward where the rocket comes from
  let dx = rx - g.x, dy = ry - g.y; const L = Math.hypot(dx,dy) || 1; dx/=L; dy/=L;
  const off = Math.max(g.r, g.hw*.85) + rocketSize*.75;
  let px = g.x + dx*off, py = g.y + dy*off;
  px = Math.min(Math.max(px, rocketSize), innerWidth - rocketSize);
  py = Math.min(Math.max(py, rocketSize), innerHeight - rocketSize*1.3);
  return [px, py];
}
function placeRocketNear(id){ const g = geo[id]; const off = g.r + rocketSize*.75; const side = innerWidth >= innerHeight ? -1 : 1; setRocket(g.x + side*off*.8, g.y + off*.6, -side*20); }
function flyTo(tx, ty, onArrive){
  if(anim) cancelAnimationFrame(anim);
  const x0 = rx, y0 = ry, dx = tx - x0, dy = ty - y0, dist = Math.hypot(dx,dy);
  if(dist < 4){ onArrive && onArrive(); return; }
  const dur = Math.min(1800, Math.max(650, dist*2.2));
  const cx = x0 + dx/2 - dy*.25, cy = y0 + dy/2 + dx*.25 - dist*.1;
  const rEl = document.getElementById("rocket"); rEl.classList.add("flying"); whoosh();
  const t0 = performance.now();
  const step = now => {
    let t = Math.min(1, (now - t0)/dur);
    const e = t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
    const u = 1-e;
    const x = u*u*x0 + 2*u*e*cx + e*e*tx, y = u*u*y0 + 2*u*e*cy + e*e*ty;
    const vx = 2*u*(cx-x0) + 2*e*(tx-cx), vy = 2*u*(cy-y0) + 2*e*(ty-cy);
    let ang = Math.atan2(vy, vx)*180/Math.PI + 90;
    if(t > .85){ const k = (t-.85)/.15; ang = ang*(1-k) + 0*k; }
    setRocket(x, y, ang);
    if(t < 1) anim = requestAnimationFrame(step);
    else finish();
  };
  // safety net: if animation frames are paused (hidden tab, slow device), still arrive
  const myFlight = ++flightId;
  const finish = () => { if(myFlight !== flightId || done) return; done = true; clearTimeout(safety);
    if(anim) cancelAnimationFrame(anim); anim = null; setRocket(tx, ty, 0); rEl.classList.remove("flying"); onArrive && onArrive(); };
  let done = false;
  const safety = setTimeout(finish, dur + 400);
  anim = requestAnimationFrame(step);
}
function goTo(id){
  if(busy()) return;
  const [px, py] = parkPoint(id);
  rocketAt = id;
  document.getElementById("hint").textContent = "Flying to " + BODIES.find(b=>b.id===id).name + "...";
  flyTo(px, py, () => openCard(id));
}

  const steps = [], lit = new Set();

    sk.forEach((s, i) => {
      if(i === 0 && lit.has(s)){ pen = s; return; }

}

function csSetMode(easy){
  csEasy = easy; csRenderPicker();
  say(easy ? "Easy stars! Follow the numbers: one, two, three!" : "Tricky stars! No numbers. Look at the little picture, and connect the stars that go together.");
}
function csStart(id){
  const c = csFind(id);
  cs = {c, steps: csPlan(c), k: 0, edges: new Set(csEdges(c)), used: new Set(), pen: null, lit: new Set(), wrong: 0, finished: false, fi: 0};
  csOv.classList.remove("pick"); csOv.classList.add("play");
  document.getElementById("csPlay").classList.remove("revealed");
  document.getElementById("csName").textContent = c.name;
  document.getElementById("csThumb").innerHTML = csEasy ? "" : csMini(c, false);
  document.getElementById("csThumb").style.visibility = csEasy ? "hidden" : "visible";
  csBuildSky();
  if(csEasy) csMarkNext();
  const nm = c.name.replace(/^The /, "the ");
  say(csEasy ? "Let's make " + nm + "! Tap star number one." : "Let's make " + nm + "! Tap a star to start, then connect the stars that go together.");
}
function csBuildSky(){
  const c = cs.c, easy = csEasy;
  let bg = "";
  for(let i=0;i<80;i++) bg += `<circle cx="${(Math.random()*118-9).toFixed(1)}" cy="${(Math.random()*118-9).toFixed(1)}" r="${(Math.random()*.4+.15).toFixed(2)}" fill="#fff" opacity="${(Math.random()*.45+.15).toFixed(2)}"/>`;
  const firstNum = {}; cs.steps.forEach((s, i) => { if(!(s.to in firstNum)) firstNum[s.to] = i + 1; });
  let st = "";
  c.stars.forEach((s, i) => {
    const r = csStarR(s[2]) * (easy ? 1.3 : 1.05);
    const tag = c.tags[i] ? `<text class="cs-tag" y="${(r + 6.5).toFixed(1)}" text-anchor="middle" font-size="4.2" font-weight="bold" fill="#ffe9a8" stroke="#120a3a" stroke-width=".8" paint-order="stroke">${c.tags[i]}</text>` : "";
    const num = easy ? `<g class="num" transform="translate(${(r + 3).toFixed(1)} ${(-r - 3).toFixed(1)})"><circle r="3.6" fill="#ff5e7e" stroke="#fff" stroke-width=".6"/><text y="1.6" text-anchor="middle" font-size="4.6" font-weight="bold" fill="#fff">${firstNum[i]}</text></g>` : "";
    st += `<g class="cs-star" data-i="${i}" transform="translate(${s[0]} ${s[1]})"><circle r="${(r*2.6).toFixed(1)}" fill="url(#csGlow)"/><circle class="ring" r="${(r + 2.6).toFixed(1)}" fill="none" stroke-width="1"/><circle class="core" r="${r.toFixed(1)}"/>${num}${tag}</g>`;
  });
  csSky.classList.remove("done");
  csSky.innerHTML = `<defs><radialGradient id="csGlow"><stop offset="0" stop-color="#fff6c9" stop-opacity=".75"/><stop offset="1" stop-color="#fff6c9" stop-opacity="0"/></radialGradient></defs>
    <g>${bg}</g><text class="cs-pic" x="50" y="50" text-anchor="middle" dominant-baseline="central" font-size="78">${c.pic}</text>
    <g id="csLines"></g><g>${st}</g><g id="csNextNum"></g>`;
}
function csStarEl(i){ return csSky.querySelector(`.cs-star[data-i="${i}"]`); }
function csMarkNext(){
  csSky.querySelectorAll(".cs-star.next").forEach(e => e.classList.remove("next"));
  const nn = document.getElementById("csNextNum"); nn.innerHTML = "";
  if(!cs || !csEasy || cs.finished || cs.k >= cs.steps.length) return;
  const to = cs.steps[cs.k].to; csStarEl(to).classList.add("next");
  if(cs.lit.has(to)){ // going back to a star she already lit: show the step number there
    const s = cs.c.stars[to], r = csStarR(s[2]) * 1.3;
    nn.innerHTML = `<g transform="translate(${(s[0] + r + 3).toFixed(1)} ${(s[1] - r - 3).toFixed(1)})"><circle r="3.6" fill="#ff5e7e" stroke="#fff" stroke-width=".6"/><text y="1.6" text-anchor="middle" font-size="4.6" font-weight="bold" fill="#fff">${cs.k + 1}</text></g>`;
  }
}
function csLine(a, b){
  const A = cs.c.stars[a], B = cs.c.stars[b], len = Math.hypot(B[0]-A[0], B[1]-A[1]).toFixed(1);
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", `M${A[0]} ${A[1]} L${B[0]} ${B[1]}`); p.setAttribute("class", "cs-line");
  p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
  document.getElementById("csLines").appendChild(p);
}
function csLight(i){ cs.lit.add(i); csStarEl(i).classList.add("lit"); }
function csNote(){ tone(CS_NOTES[Math.min(cs.used.size + cs.k, CS_NOTES.length - 1)], 0, .45, "triangle", .13); }
function csOops(i){
  tone(196, 0, .2, "sine", .08);
  const el = csStarEl(i); if(!el) return;
  el.classList.remove("oops"); void el.getBBox(); el.classList.add("oops");
  setTimeout(() => el.classList.remove("oops"), 550);
}
function csHint(){ // Tricky mode: after two misses, make the stars that can come next twinkle
  csSky.querySelectorAll(".cs-star.hint").forEach(e => e.classList.remove("hint"));
  cs.c.stars.forEach((s, i) => {
    const ok = cs.pen === null ? csLeft(i) > 0 : cs.edges.has(csKey(cs.pen, i)) && !cs.used.has(csKey(cs.pen, i));
    if(ok) csStarEl(i).classList.add("hint");
  });
}
function csLeft(i){ let n = 0; cs.edges.forEach(k => { if(!cs.used.has(k) && k.split("-").map(Number).includes(i)) n++; }); return n; }
function csTap(e){
  if(!cs || cs.finished) return;
  const m = csSky.getScreenCTM(); if(!m) return;
  const pt = csSky.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const q = pt.matrixTransform(m.inverse()), unit = Math.abs(m.a) || 1;
  const hit = 46 / unit; // about 46px finger reach around each star
  let best = -1, bd = 1e9;
  cs.c.stars.forEach((s, i) => { const d = Math.hypot(q.x - s[0], q.y - s[1]); if(d < bd){ bd = d; best = i; } });
  if(csEasy){
    const step = cs.steps[cs.k], t = cs.c.stars[step.to];
    if(Math.hypot(q.x - t[0], q.y - t[1]) <= hit * 1.4 || (best === step.to && bd <= hit * 2)){
      if(step.from !== null) csLine(step.from, step.to);
      csNote(); csLight(step.to); cs.k++;
      if(cs.k >= cs.steps.length) csFinish(); else csMarkNext();
    } else if(bd <= hit){
      csOops(best); csStarEl(step.to).classList.remove("next"); void csStarEl(step.to).getBBox(); csStarEl(step.to).classList.add("next");
    }
    return;
  }
  if(bd > hit) return;
  const s = best;
  if(cs.pen === s) return;
  if(cs.pen !== null && cs.edges.has(csKey(cs.pen, s)) && !cs.used.has(csKey(cs.pen, s))){
    csLine(cs.pen, s); cs.used.add(csKey(cs.pen, s)); csNote(); csLight(s); cs.wrong = 0;
    csSky.querySelectorAll(".cs-star.hint").forEach(e => e.classList.remove("hint"));
    if(cs.used.size === cs.edges.size){ csSetPen(null); csFinish(); return; }
    csSetPen(csLeft(s) > 0 ? s : null);
  } else if((cs.pen === null || csLeft(cs.pen) === 0) && csLeft(s) > 0){
    csSetPen(s); csLight(s); csNote(); cs.wrong = 0;
    csSky.querySelectorAll(".cs-star.hint").forEach(e => e.classList.remove("hint"));
  } else {
    csOops(s); cs.wrong++;
    if(cs.wrong >= 2) csHint();
  }
}
function csSetPen(i){
  csSky.querySelectorAll(".cs-star.pen").forEach(e => e.classList.remove("pen"));
  cs.pen = i; if(i !== null) csStarEl(i).classList.add("pen");
}
function csFinish(){
  cs.finished = true; csMarkNext();
  csSky.querySelectorAll(".cs-star.hint,.cs-star.pen").forEach(e => e.classList.remove("hint","pen"));
  csSky.classList.add("done");
  const c = cs.c, isNew = !csDone.has(c.id);
  if(isNew){ csDone.add(c.id); csUpdateCount(); }
  setTimeout(() => {
    if(!cs || cs.c !== c) return;
    chime();
    const earned = document.getElementById("csEarned");
    if(isNew){ earned.innerHTML = STAR_SVG + "<span>You got a star!</span>"; earned.style.display = "inline-flex"; }
    else earned.style.display = "none";
    document.getElementById("csRName").textContent = c.name + " " + c.pic;
    document.getElementById("csPlay").classList.add("revealed");
    csShowFact(0, true);
  }, 700);
}
function csShowFact(i, first){
  const c = cs.c; i = i % c.facts.length; cs.fi = i;
  const f = document.getElementById("csFact");
  f.textContent = c.facts[i]; f.classList.remove("newfact"); void f.offsetWidth; f.classList.add("newfact");
  document.getElementById("csDots").innerHTML = c.facts.map((_, k) => `<span class="${k === i ? "on" : ""}"></span>`).join("");
  const intro = first ? "You made " + c.name.replace(/^The /, "the ") + ", " + c.picName + "! Great job, " + PLAYER_NAME + "! " : "";
  say(intro + c.facts[i]);
}
let csBits = [], csConfAnim = null;
function csConfetti(){
  conf.width = innerWidth; conf.height = innerHeight;
  const cols = ["#ffd60a","#fff3b0","#7ee8fa","#ff5e7e","#b28dff"];
  csBits = Array.from({length:150}, () => ({x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*.6, vx:(Math.random()-.5)*3, vy:2+Math.random()*3,
    r:Math.random()*6.28, vr:(Math.random()-.5)*.3, s:7+Math.random()*8, c:cols[Math.random()*cols.length|0]}));
  const t0 = performance.now();
  const step = now => {
    cctx.clearRect(0,0,conf.width,conf.height);
    for(const p of csBits){
      p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vy += .03;
      cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.r); cctx.fillStyle = p.c; cctx.beginPath();
      for(let i=0;i<10;i++){ const a=i*Math.PI/5, rr=i%2?p.s*.45:p.s; cctx.lineTo(Math.sin(a)*rr,-Math.cos(a)*rr); }
      cctx.closePath(); cctx.fill(); cctx.restore();
    }
    if(now - t0 < 5000) csConfAnim = requestAnimationFrame(step); else cctx.clearRect(0,0,conf.width,conf.height);
  };
  if(csConfAnim) cancelAnimationFrame(csConfAnim);
  csConfAnim = requestAnimationFrame(step);
}

document.getElementById("csNext").innerHTML = ICON_GO + "<span>More star pictures</span>";

/* ---------------- Wire up ---------------- */
