<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#120a3a">
<title>Space Explorer!</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Space Explorer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root{
    --font: "Comic Sans MS","Chalkboard SE","Comic Neue","Baloo 2","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#120a3a;font-family:var(--font);color:#fff;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  #sky{position:fixed;inset:0;width:100%;height:100%;display:block;
    background:radial-gradient(ellipse at 20% 30%,#3b1d7a 0%,rgba(59,29,122,0) 55%),
               radial-gradient(ellipse at 80% 75%,#7a1d6b 0%,rgba(122,29,107,0) 50%),
               radial-gradient(ellipse at 60% 10%,#1d4a7a 0%,rgba(29,74,122,0) 45%),
               linear-gradient(180deg,#0d0830 0%,#1b0f4d 60%,#2a0f45 100%);}
  #space{position:fixed;inset:0;}
  button{font-family:var(--font);}
  .body-btn{position:absolute;transform:translate(-50%,-50%);border:none;background:none;padding:0;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;outline:none;}
  .body-btn .art{display:block;transition:transform .25s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 0 10px rgba(255,255,255,.25));}
  .body-btn:hover .art,.body-btn:focus-visible .art{transform:scale(1.12);}
  .body-btn:active .art{transform:scale(.95);}
  .body-btn .label{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;white-space:nowrap;
    font-size:clamp(14px,2.1vmin,22px);font-weight:bold;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;
    background:rgba(20,10,60,.55);padding:1px 10px;border-radius:999px;pointer-events:none;}
  .body-btn .got{position:absolute;right:-4%;top:-4%;width:34%;min-width:22px;max-width:40px;opacity:0;transform:scale(0);
    transition:all .4s cubic-bezier(.3,1.8,.5,1);pointer-events:none;}
  .body-btn.visited .got{opacity:1;transform:scale(1);}
  .spin{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .wobble{animation:wobble 4s ease-in-out infinite;}
  @keyframes wobble{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  #rocket{position:absolute;left:0;top:0;width:var(--rs,70px);height:calc(var(--rs,70px)*1.5);pointer-events:none;z-index:5;
    transform-origin:50% 50%;will-change:transform;}
  #rocket .bob{width:100%;height:100%;animation:bob 1.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
  #rocket .flame{transform-origin:50% 0;animation:flick .12s infinite alternate;opacity:.35;transition:opacity .2s;}
  #rocket.flying .flame{opacity:1;}
  @keyframes flick{from{transform:scaleY(.85)}to{transform:scaleY(1.2)}}

  /* top bar */
  #topbar{position:fixed;left:0;right:0;top:0;display:flex;justify-content:center;align-items:center;gap:12px;padding:10px;z-index:6;pointer-events:none;}
  #hint{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.25);padding:6px 18px;border-radius:999px;
    font-size:clamp(16px,2.6vmin,26px);font-weight:bold;text-shadow:0 2px 0 rgba(0,0,0,.4);}
  /* sticker bar */
  #stickers{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(4px,1vmin,8px);align-items:center;width:max-content;
    background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.25);border-radius:30px;padding:6px 14px;z-index:6;max-width:96vw;}
  #stickers .slot{width:clamp(30px,min(5vmin,8.5vw),48px);height:clamp(30px,min(5vmin,8.5vw),48px);border-radius:50%;position:relative;border:none;padding:0;
    background:rgba(0,0,0,.25);cursor:pointer;}
  #stickers .slot svg.mini{width:100%;height:100%;filter:grayscale(1) brightness(.55);opacity:.6;transition:all .4s;}
  #stickers .slot.on svg.mini{filter:none;opacity:1;}
  #stickers .slot .st{position:absolute;right:-6px;top:-6px;width:55%;opacity:0;transform:scale(0) rotate(-90deg);transition:all .5s cubic-bezier(.3,1.8,.5,1);}
  #stickers .slot.on .st{opacity:1;transform:scale(1) rotate(0);}
  #count{font-weight:bold;font-size:clamp(14px,2.4vmin,24px);margin-left:6px;white-space:nowrap;}

  /* overlays */
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
    background:rgba(8,4,30,.6);opacity:0;pointer-events:none;transition:opacity .3s;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .card{width:min(92vw,760px);max-height:94vh;overflow:auto;background:#fffaf0;color:#2b1d4f;border-radius:36px;border:8px solid var(--c,#ffcc33);
    box-shadow:0 0 0 8px rgba(255,255,255,.2),0 20px 60px rgba(0,0,0,.6);padding:22px 28px 26px;text-align:center;
    transform:scale(.6) translateY(40px);transition:transform .45s cubic-bezier(.3,1.6,.5,1);}
  .overlay.show .card{transform:scale(1) translateY(0);}
  .card .big{width:min(40vmin,240px);height:min(40vmin,240px);margin:0 auto;display:block;}
  .card h1{margin:4px 0 6px;font-size:clamp(34px,7vmin,64px);color:var(--c,#ffcc33);
    text-shadow:3px 3px 0 #2b1d4f,-1px -1px 0 #2b1d4f,1px -1px 0 #2b1d4f,-1px 1px 0 #2b1d4f;letter-spacing:1px;}
  .card p.fact{font-size:clamp(22px,4vmin,36px);line-height:1.35;margin:4px 0 16px;font-weight:bold;}
  .card .earned{display:inline-flex;align-items:center;gap:8px;font-size:clamp(18px,3vmin,26px);font-weight:bold;color:#b8860b;
    background:#fff3c4;border-radius:999px;padding:4px 16px;margin-bottom:12px;}
  .card .earned svg{width:34px;height:34px;animation:pop .8s cubic-bezier(.3,1.8,.5,1);}
  @keyframes pop{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
  .btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
  .bigbtn{display:inline-flex;align-items:center;gap:10px;border:none;border-radius:999px;cursor:pointer;
    font-size:clamp(20px,3.4vmin,30px);font-weight:bold;padding:14px 26px;min-height:64px;color:#fff;
    box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .1s;}
  .bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .bigbtn svg{width:36px;height:36px;}
  .b-blue{background:#2f80ed;} .b-purple{background:#9b5de5;}
  .dots{display:flex;gap:8px;justify-content:center;margin:-6px 0 14px;}
  .dots span{width:14px;height:14px;border-radius:50%;background:#e2d9f3;}
  .dots span.on{background:var(--c,#ffcc33);box-shadow:0 0 0 2px #2b1d4f;}
  .newfact{animation:factin .45s cubic-bezier(.3,1.5,.5,1);}
  @keyframes factin{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
  /* talking animation: mouths move, card planet and rocket bounce */
  .mouth{transform-box:fill-box;transform-origin:center top;}
  body.talking #cardOv .mouth, body.talking #party .mouth{animation:talk .18s ease-in-out infinite alternate;}
  @keyframes talk{from{transform:scaleY(.6)}to{transform:scaleY(1.9) scaleX(.85)}}
  body.talking #cardArt .big{animation:boing .5s ease-in-out infinite alternate;}
  @keyframes boing{from{transform:translateY(0) scale(1,1)}to{transform:translateY(-6px) scale(1.04,.97)}}
  body.talking #rocket .bob{animation-duration:.5s;} .b-green{background:#27ae60;} .b-orange{background:#f2994a;}

  @media (max-width:480px), (max-height:700px){
    .card{padding:12px 14px 16px;border-width:6px;border-radius:28px;}
    .card .big{height:min(26vh,170px);}
    .card h1{font-size:clamp(28px,8vw,44px);margin:0 0 4px;}
    .card p.fact{font-size:clamp(19px,5.2vw,28px);margin:2px 0 12px;}
    .card .earned{margin-bottom:6px;padding:2px 12px;font-size:18px;}
    .card .earned svg{width:26px;height:26px;}
    .dots{margin:-4px 0 10px;}
    .btns{gap:10px;}
    .bigbtn{font-size:19px;padding:8px 18px;min-height:56px;gap:8px;}
    .bigbtn svg{width:30px !important;height:30px !important;}
  }
  #start{background:rgba(8,4,30,.35);flex-direction:column;text-align:center;}
  #start h1{font-size:clamp(44px,11vmin,110px);margin:0;color:#ffd84d;
    text-shadow:0 6px 0 #e8590c,0 10px 20px rgba(0,0,0,.6);transform:rotate(-3deg);}
  #start p{font-size:clamp(20px,3.6vmin,32px);margin:8px 0 22px;font-weight:bold;}
  #start .rk{width:min(22vmin,150px);animation:bob 1.6s ease-in-out infinite;}
  #startBtn{font-size:clamp(28px,6vmin,52px);padding:20px 48px;background:#ff5e7e;animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  #party h1{font-size:clamp(34px,7vmin,60px);color:#ff5e7e;margin:6px 0;text-shadow:2px 2px 0 #2b1d4f;}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:11;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="space"></div>
<div id="topbar"><div id="hint">Tap a planet to fly there!</div></div>
<div id="stickers"></div>

<div id="cardOv" class="overlay" role="dialog" aria-modal="true">
  <div class="card" id="card">
    <div id="cardArt"></div>
    <h1 id="cardName">Planet</h1>
    <div id="earned" class="earned" style="display:none"></div>
    <p class="fact" id="cardFact">Fact</p>
    <div id="dots" class="dots"></div>
    <div class="btns">
      <button class="bigbtn b-blue" id="againBtn" aria-label="Hear it again"></button>
      <button class="bigbtn b-purple" id="moreBtn" aria-label="Tell me more"></button>
      <button class="bigbtn b-green" id="closeBtn" aria-label="Keep exploring"></button>
    </div>
  </div>
</div>

<div id="party" class="overlay" role="dialog" aria-modal="true">
  <div class="card" style="--c:#ff5e7e">
    <div id="partyArt"></div>
    <h1>You did it!</h1>
    <p class="fact" id="partyText">You visited every place in space. You are a real Space Explorer!</p>
    <div class="btns">
      <button class="bigbtn b-orange" id="replayBtn"></button>
    </div>
  </div>
</div>

<div id="start" class="overlay show">
  <div id="startRocket"></div>
  <h1>Space Explorer!</h1>
  <p>Fly your rocket to the Sun, the Moon, and the planets!</p>
  <button class="bigbtn" id="startBtn">Tap to Start</button>
</div>
<canvas id="confetti"></canvas>

<script>
(function(){
"use strict";

/* ---------------- Data ---------------- */
// Facts checked against NASA kid/science pages.
const BODIES = [
  {id:"sun", name:"The Sun", color:"#ffb703", size:.24, facts:[
    "The Sun is a star! It is so big that more than one million Earths could fit inside it.",
    "The Sun gives us light and keeps us warm. Plants need sunlight to grow.",
    "Light from the Sun takes about eight minutes to zoom all the way to Earth."]},
  {id:"mercury", name:"Mercury", color:"#a8a29e", size:.06, facts:[
    "Mercury is the smallest planet. It is also the closest planet to the Sun.",
    "Mercury zooms around the Sun faster than any other planet. A year there is only 88 days!",
    "Mercury has no moons at all."]},
  {id:"venus", name:"Venus", color:"#f4a261", size:.08, facts:[
    "Venus is the hottest planet. Its thick clouds trap heat like a big, warm blanket.",
    "Venus spins the opposite way from most planets. On Venus, the Sun rises in the west!",
    "Venus is the brightest planet in our night sky. People sometimes call it the Evening Star."]},
  {id:"earth", name:"Earth", color:"#3a86ff", size:.085, facts:[
    "Earth is our home! It is the only planet we know of with plants, animals, and people.",
    "Most of Earth is covered with water. That is why it looks so blue from space!",
    "Earth goes all the way around the Sun once every year. That trip is one whole year!"]},
  {id:"moon", name:"The Moon", color:"#cbd5e1", size:.045, facts:[
    "The Moon goes around the Earth. Astronauts have walked on the Moon!",
    "The Moon has no wind, so astronaut footprints there can last for a very, very long time.",
    "The Moon does not make its own light. It shines because sunlight bounces off it."]},
  {id:"iss", name:"Space Station", color:"#94a3b8", size:.07, facts:[
    "The International Space Station is a home in space where astronauts live and work.",
    "The Space Station flies all the way around the Earth about 16 times every day!",
    "Astronauts on the Space Station float! They sleep in sleeping bags tied to the wall."]},
  {id:"mars", name:"Mars", color:"#e76f51", size:.07, facts:[
    "Mars looks red because its dust is rusty, like an old bike left out in the rain.",
    "Mars has a giant volcano called Olympus Mons. It is the biggest volcano in the whole solar system!",
    "Robot rovers have driven on Mars. They take pictures and study the rocks for us."]},
  {id:"asteroids", name:"Asteroid Belt", color:"#b08968", size:.09, facts:[
    "The asteroid belt is a big ring of space rocks between Mars and Jupiter.",
    "Some asteroids are as small as pebbles. The biggest one, Ceres, is a dwarf planet!",
    "The asteroids are very far apart from each other, so spaceships can fly through safely."]},
  {id:"jupiter", name:"Jupiter", color:"#e9a86b", size:.15, facts:[
    "Jupiter is the biggest planet. It has a giant storm that is bigger than the whole Earth!",
    "Jupiter has lots and lots of moons. It has more than 90 of them!",
    "Jupiter is made mostly of gas. There is no ground to stand on!"]},
  {id:"saturn", name:"Saturn", color:"#e9c46a", size:.115, facts:[
    "Saturn has beautiful rings. The rings are made of lots of pieces of ice and rock.",
    "Saturn is very light for its size. In a giant bathtub, it would float!",
    "Saturn has more moons than any other planet. It has more than 200!"]},
  {id:"uranus", name:"Uranus", color:"#6fd6e8", size:.095, facts:[
    "Uranus spins on its side, so it rolls around the Sun like a ball.",
    "Uranus looks blue-green because of a gas in its air called methane.",
    "Uranus has the coldest air of any planet. Brrr!"]},
  {id:"neptune", name:"Neptune", color:"#4f6df5", size:.095, facts:[
    "Neptune is the farthest planet from the Sun. It has the fastest winds of any planet!",
    "Neptune is so far away that one trip around the Sun takes about 165 years!",
    "Scientists used math to find Neptune before anyone ever saw it in a telescope."]},
  {id:"pluto", name:"Pluto", color:"#d4a373", size:.05, facts:[
    "Pluto is a dwarf planet. It is even smaller than our Moon!",
    "Pluto has a giant heart shape on it, made of ice!",
    "Pluto is so far away that the New Horizons spaceship took more than nine years to get there."]},
  {id:"comet", name:"Comet", color:"#7ee8fa", size:.085, facts:[
    "A comet is like a big, dirty snowball made of ice, dust, and rock.",
    "When a comet comes close to the Sun, its ice warms up and makes a long, glowing tail.",
    "A comet's tail always points away from the Sun, even when the comet is flying away!"]}
];
const INTROS = ["Whoa!","Guess what?","Did you know?","Wow-wee!","Ooh, listen!","Here's a cool one!","Hey, explorer!","Zoom zoom!"];
const factIdx = {}; // which fact each place shows next
// [x, y] as fractions of the play area, for wide (landscape) and tall (portrait) screens
const LAYOUT_WIDE = {
  sun:[.085,.5], mercury:[.228,.27], venus:[.255,.70], earth:[.345,.42], moon:[.405,.17], iss:[.315,.13],
  mars:[.435,.74], asteroids:[.515,.36], jupiter:[.615,.58], saturn:[.75,.80], uranus:[.80,.33],
  neptune:[.885,.66], pluto:[.955,.36], comet:[.66,.10]
};
const LAYOUT_TALL = {
  sun:[.5,.05], comet:[.84,.13], mercury:[.16,.17], venus:[.42,.24],
  iss:[.15,.36], earth:[.42,.415], moon:[.74,.33], mars:[.24,.53], asteroids:[.66,.515],
  jupiter:[.38,.66], saturn:[.77,.70], uranus:[.17,.83], neptune:[.50,.90], pluto:[.84,.88]
};

/* ---------------- SVG art ---------------- */
let uid = 0;
function face(s){ // s = scale relative to r=50
  return `<g transform="scale(${s})">
    <ellipse cx="-15" cy="2" rx="5" ry="7" fill="#2b1d4f"/><ellipse cx="15" cy="2" rx="5" ry="7" fill="#2b1d4f"/>
    <circle cx="-13" cy="-1" r="2" fill="#fff"/><circle cx="17" cy="-1" r="2" fill="#fff"/>
    <ellipse cx="-25" cy="14" rx="6" ry="3.5" fill="#ff7aa2" opacity=".55"/><ellipse cx="25" cy="14" rx="6" ry="3.5" fill="#ff7aa2" opacity=".55"/>
    <path class="mouth" d="M-9 14 Q0 23 9 14" stroke="#2b1d4f" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>`;
}
function ball(g, c1, c2, extra){
  return `<defs><radialGradient id="${g}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient>
    <clipPath id="${g}c"><circle r="50"/></clipPath></defs>
    <circle r="50" fill="url(#${g})"/><g clip-path="url(#${g}c)">${extra||""}</g>
    <circle r="50" fill="none" stroke="rgba(0,0,0,.15)" stroke-width="3"/>
    <ellipse cx="-18" cy="-24" rx="14" ry="8" fill="#fff" opacity=".25" transform="rotate(-30 -18 -24)"/>`;
}
function art(id, withFace){
  const g = "g"+(uid++);
  const f = withFace===false ? "" : face(1);
  const fs = sc => withFace===false ? "" : face(sc);
  let vb = "-60 -60 120 120", body = "";
  switch(id){
    case "sun": {
      let rays = "";
      for(let i=0;i<12;i++) rays += `<path d="M-7 -54 L0 -72 L7 -54Z" fill="#ffd166" transform="rotate(${i*30})"/>`;
      vb = "-78 -78 156 156";
      body = `<defs><radialGradient id="${g}" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ffd166"/><stop offset="1" stop-color="#fb8500"/></radialGradient>
        <radialGradient id="${g}h"><stop offset=".55" stop-color="#ffb703" stop-opacity=".7"/><stop offset="1" stop-color="#ffb703" stop-opacity="0"/></radialGradient></defs>
        <circle r="78" fill="url(#${g}h)"/><g class="spin">${rays}</g><circle r="52" fill="url(#${g})"/>${f}`;
      break;
    }
    case "mercury":
      body = ball(g,"#e7e2da","#78716c",`<circle cx="20" cy="-18" r="9" fill="#8a837c" opacity=".6"/><circle cx="-28" cy="22" r="7" fill="#8a837c" opacity=".6"/><circle cx="26" cy="28" r="5" fill="#8a837c" opacity=".6"/><circle cx="-6" cy="-36" r="5" fill="#8a837c" opacity=".6"/>`)+f; break;
    case "venus":
      body = ball(g,"#ffe8a3","#e08e3c",`<path d="M-60 -20 Q-20 -35 10 -18 T60 -22" stroke="#f9c56b" stroke-width="9" fill="none" opacity=".8"/><path d="M-60 30 Q-15 18 15 32 T60 26" stroke="#f9c56b" stroke-width="9" fill="none" opacity=".8"/>`)+f; break;
    case "earth":
      body = ball(g,"#6ec6ff","#1d4ed8",`<path d="M-42 -30 Q-30 -45 -12 -38 Q-2 -30 -14 -18 Q-26 -6 -20 8 Q-30 18 -44 6Z" fill="#3fbf5f"/><path d="M14 -40 Q34 -38 40 -22 Q46 -4 30 0 Q18 4 22 22 Q16 40 4 32 Q-4 18 6 4 Q2 -12 10 -22Z" fill="#3fbf5f"/><path d="M-30 40 Q-10 34 10 44 L10 60 L-30 60Z" fill="#fff" opacity=".9"/><path d="M-40 -6 Q-20 -12 0 -6" stroke="#fff" stroke-width="5" fill="none" opacity=".7" stroke-linecap="round"/>`)+f; break;
    case "moon":
      body = ball(g,"#f8fafc","#94a3b8",`<circle cx="22" cy="-20" r="10" fill="#94a3b8" opacity=".55"/><circle cx="-26" cy="-26" r="6" fill="#94a3b8" opacity=".55"/><circle cx="28" cy="26" r="7" fill="#94a3b8" opacity=".55"/><circle cx="-30" cy="30" r="5" fill="#94a3b8" opacity=".55"/>`)+f; break;
    case "mars":
      body = ball(g,"#ff9b6b","#b23a1d",`<ellipse cx="0" cy="-50" rx="24" ry="10" fill="#fff"/><path d="M-40 24 Q-20 14 -4 28 Q-14 40 -36 38Z" fill="#a8321a" opacity=".55"/><circle cx="26" cy="-12" r="8" fill="#a8321a" opacity=".45"/>`)+f; break;
    case "jupiter":
      body = ball(g,"#fbe3c2","#c07a43",`<rect x="-60" y="-38" width="120" height="9" fill="#c98a5a" opacity=".8"/><rect x="-60" y="-20" width="120" height="7" fill="#e7b98c"/><rect x="-60" y="28" width="120" height="9" fill="#c98a5a" opacity=".8"/><rect x="-60" y="42" width="120" height="6" fill="#e7b98c"/><ellipse cx="24" cy="34" rx="12" ry="7" fill="#d1495b" stroke="#a8323e" stroke-width="2"/>`)+f; break;
    case "saturn":
      vb = "-95 -60 190 120";
      body = `<defs><clipPath id="${g}f"><rect x="-100" y="0" width="200" height="80"/></clipPath></defs>
        <g transform="rotate(-14)"><ellipse rx="90" ry="22" fill="none" stroke="#d9b36a" stroke-width="12"/><ellipse rx="90" ry="22" fill="none" stroke="#f5e1a4" stroke-width="4"/></g>
        <g>${ball(g,"#fff1c1","#d4a24c",`<rect x="-60" y="-30" width="120" height="8" fill="#e0b867" opacity=".8"/><rect x="-60" y="26" width="120" height="7" fill="#e0b867" opacity=".8"/>`)}${f}</g>

const synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;

function pickVoice(){

  const kid = [/\bAna\b/i, /Junior/i, /\bKid/i, /Child/i, /\bIvy\b/i, /\bJustin\b/i];
  for(const re of kid){ const v = vs.find(v => re.test(v.name)); if(v){ voice = v; kidVoice = true; return; } }
  kidVoice = false;
  const prefer = [/Jenny.*Online|Aria.*Online|Ava.*Online|Emma.*Online/i, /Samantha/i, /Google US English/i, /Microsoft (Aria|Jenny|Zira)/i,
                  /Karen/i, /Tessa/i, /Moira/i, /Google UK English Female/i, /Serena|Victoria|Allison|Susan/i];
  for(const re of prefer){ const v = vs.find(v => re.test(v.name)); if(v){ voice = v; return; } }

        if(voice) u.voice = voice;

    p:Math.random()*6.28, s:Math.random()*2+.5, c:["#fff","#fff","#ffe9a8","#bfe3ff","#ffc8e8"][Math.random()*5|0]}));

  f.classList.remove("newfact"); void f.offsetWidth; f.classList.add("newfact");
  document.getElementById("dots").innerHTML = b.facts.map((_, k) => `<span class="${k===i?"on":""}"></span>`).join("");
  const intro = INTROS[Math.floor(Math.random()*INTROS.length)];
  say((withName ? b.name + "! " : "") + intro + " " + b.facts[i]);
}
function closeCard(){
  cardOv.classList.remove("show"); stopTalking();
  if(partyPending){ partyPending = false; setTimeout(party, 350); }
}
function updateCount(){ document.getElementById("count").textContent = visited.size + " / " + BODIES.length; }

/* ---------------- Celebration ---------------- */
const conf = document.getElementById("confetti"), cctx = conf.getContext("2d");
let bits = [], confAnim = null;
function party(){
  document.getElementById("partyArt").innerHTML = `<div style="width:min(30vmin,180px);margin:0 auto">${ROCKET_SVG}</div>`;
  document.getElementById("party").classList.add("show");
  fanfare();
  document.getElementById("partyText").textContent = "You visited all " + BODIES.length + " places in space. You are a real Space Explorer!";
  say("Hooray! You visited all " + BODIES.length + " places in space. You are a real space explorer!");
  conf.width = innerWidth; conf.height = innerHeight;
  const cols = ["#ff5e7e","#ffd60a","#3a86ff","#27ae60","#f2994a","#b28dff","#6fd6e8"];
  bits = Array.from({length:180}, () => ({x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*.6, vx:(Math.random()-.5)*3, vy:2+Math.random()*3,
    r:Math.random()*6.28, vr:(Math.random()-.5)*.3, s:6+Math.random()*8, c:cols[Math.random()*cols.length|0], star:Math.random()<.3}));
  const t0 = performance.now();
  const step = now => {
    cctx.clearRect(0,0,conf.width,conf.height);
    for(const p of bits){
      p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vy += .03;
      cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.r); cctx.fillStyle = p.c;
      if(p.star){ cctx.beginPath(); for(let i=0;i<10;i++){ const a=i*Math.PI/5, rr=i%2?p.s*.45:p.s; cctx.lineTo(Math.sin(a)*rr,-Math.cos(a)*rr);} cctx.closePath(); cctx.fill(); }
      else cctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      cctx.restore();
    }
    if(now - t0 < 6000) confAnim = requestAnimationFrame(step); else cctx.clearRect(0,0,conf.width,conf.height);
  };
  if(confAnim) cancelAnimationFrame(confAnim);
  confAnim = requestAnimationFrame(step);
}
function replay(){
  document.getElementById("party").classList.remove("show");
  visited.clear(); updateCount();
  document.querySelectorAll(".body-btn.visited,.slot.on").forEach(e => e.classList.remove("visited","on"));
  stopTalking();
  say("Let's explore again! Tap a planet to fly there.");
}

/* ---------------- Wire up ---------------- */
document.getElementById("startRocket").innerHTML = `<div class="rk">${ROCKET_SVG}</div>`;
document.getElementById("againBtn").innerHTML = ICON_SPEAK + "<span>Hear it again</span>";
document.getElementById("moreBtn").innerHTML = STAR_SVG.replace("<svg","<svg style=\"width:36px;height:36px\"") + "<span>Tell me more!</span>";
document.getElementById("closeBtn").innerHTML = ICON_GO + "<span>Keep exploring</span>";
document.getElementById("replayBtn").innerHTML = ICON_AGAIN + "<span>Play again</span>";
document.getElementById("againBtn").addEventListener("click", e => { e.stopPropagation(); const b = BODIES.find(b=>b.id===currentId); if(b) say(b.facts[shownIdx]); });
document.getElementById("moreBtn").addEventListener("click", e => { e.stopPropagation(); const b = BODIES.find(b=>b.id===currentId); if(b) showFact(b, shownIdx + 1, false); });
document.getElementById("closeBtn").addEventListener("click", e => { e.stopPropagation(); closeCard(); });
cardOv.addEventListener("click", e => { if(e.target === cardOv) closeCard(); });
document.getElementById("replayBtn").addEventListener("click", e => { e.stopPropagation(); replay(); });
document.getElementById("startBtn").addEventListener("click", e => {
  e.stopPropagation();
  try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(err){ actx = null; }
  document.getElementById("start").classList.remove("show");
  chime();
  say("Hi, space explorer! Tap a planet, and your rocket will fly there.");
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && cardOv.classList.contains("show")) closeCard(); });

buildBodies(); makeStars(); layout(); requestAnimationFrame(drawSky);
let rt = null;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { makeStars(); layout(); }, 120); });
window.__space = {visited, BODIES, factIdx}; // handy for testing
})();
</script>
